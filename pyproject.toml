[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lit-harvest"
version = "0.1.0"
description = "Local-first academic literature discovery, acquisition, and normalization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Literature Harvester contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "lxml>=5.2,<7",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.9,<1",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0",
  "lxml-stubs>=0.5",
]

[project.scripts]
lit-harvest = "lit_harvest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lit_harvest"]
include = ["src/lit_harvest/**/*.py", "src/lit_harvest/api/static/**", "src/lit_harvest/py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["lit_harvest"]
