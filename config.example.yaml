storage:
  root: ./data
database:
  url: sqlite:///./data/lit_harvest.db
scheduler:
  retry:
    max_attempts: 4
    base_delay_seconds: 2
  rate_limit:
    respect_retry_after: true
  quota:
    warning_ratio: 0.30
    low_ratio: 0.10
server:
  host: 127.0.0.1
  port: 8765
providers:
  elsevier:
    enabled: true
    # Optional: also save the publisher PDF alongside the canonical FULL XML.
    download_pdf: false

    # Usage pacing. Publishers meter access per INSTITUTION, not per person, so
    # one aggressive client can affect every researcher at your university.
    # These defaults are deliberately gentle. Raise them only if your library
    # or the publisher has given you written authorization.
    policy:
      unlimited: false
      fulltext_min_interval_seconds: 60
      pdf_min_interval_seconds: 120
      search_min_interval_seconds: 5
      fulltext_daily_limit: 100
      pdf_daily_limit: 50
      search_daily_limit: 200
      jitter_ratio: 0.25
    services:
      scopus_search:
        enabled: true
      article_retrieval:
        enabled: true
      # Used only when PDF download is enabled.
      article_pdf:
        enabled: true
    credentials:
      - name: university_primary
        # Run: lit-harvest auth set elsevier university_primary
        # Secrets are stored in <project>/.lit-harvest/secrets.json with mode 0600.
        secret_ref: file:elsevier:university_primary
        institution: HIT
        quota_scope: institution
